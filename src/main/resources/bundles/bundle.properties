unit.vintadustry-tasky.name = Tasky
unit.vintadustry-tasky.description = A mobile core. Carries up to 200 of each of 3 item types, builds with them, tows crates and Gumpys, and fires waiting players as Gumpy shots.
unit.vintadustry-crate.name = Crate
unit.vintadustry-crate.description = Storage crate with 2 item slots. Hold to hook it onto a unit, tap to open its items. Drag twigs onto it, or drag items between the panels, to store and take them.
unit.vintadustry-gumpy.name = Gumpy
unit.vintadustry-gumpy.description = Made by the Tasky for waiting players. Has no weapon, carries 1 item and up to 2 crates, can mine and build.
unit.vintadustry-galho-solto.name = Loose Branch
unit.vintadustry-galho-solto.description = A twig ripped off a tree. Drag it with the hand to within 2 blocks of a unit to collect it, or drop it onto a crate to store it.
block.vintadustry-tasky-nest.name = Tasky Nest
block.vintadustry-tasky-nest.description = Where the player spawns as the Tasky. The game is only lost if the Tasky dies.
block.vintadustry-dona-tree.name = Dona Tree
block.vintadustry-dona-tree.description = Old tree, now replaced by the Leafy Tree (same look and behavior). Hidden from the build menu.
item.vintadustry-galho.name = Twig
item.vintadustry-galho.description = A twig ripped off a tree. Its icon cycles through the twigs of the different trees.
block.vintadustry-maple-tree.name = Maple Tree
block.vintadustry-maple-tree.description = A 1x1 tree that starts with a few ready branches. Hold a fully grown branch with the laser hand and pull it away (it resists a moment) to rip it off for a Twig. When no grown branch is left, grab the trunk and keep pulling: the tree shakes, throws out 25 twigs, then topples over.
