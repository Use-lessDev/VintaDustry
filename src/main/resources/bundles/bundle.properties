block.vintadustry-cherry-tree.description = A 1x1 tree that starts with a few ready branches. Hold a fully grown branch with the laser hand and pull it away (it resists a moment) to rip it off for a Twig. When no grown branch is left, grab the trunk and keep pulling: the tree shakes, throws out 25 twigs, then topples over.
